<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Haven</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
        }
        /* ... (your existing styles) ... */

        /* Chat styles */
        .chatbox {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            max-height: 400px;
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: white;
            font-size: 14px;
        }

        .chat-header {
            background: #ff4081;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .chat-input {
            display: flex;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
        }

        .chat-input button {
            background: #ff4081;
            border: none;
            padding: 10px;
            color: white;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9em;
            color: #aaa;
        }
    </style>
</head>
<body class="theme-night">
    <div class="official-badge">Lofi Haven Official</div>
    <div class="rain" id="rain"></div>
    <div class="clouds" id="clouds"></div>
    <div class="stars" id="stars"></div>

    <audio id="background-music" autoplay loop>
        <source src="https://cdn.pixabay.com/audio/2022/07/26/audio_7771e7b2d5.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <div class="container">
        <!-- (Your existing site content) -->
    </div>

    <!-- Chat box -->
    <div class="chatbox" id="chatbox">
        <div class="chat-header" onclick="toggleChat()">☕ Lofi Café Chat</div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input">
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <footer>
        Official Lo-Fi Haven — Stay Chill, Stay Creative 🌸
    </footer>

    <script>
        const rain = document.getElementById('rain');
        const clouds = document.getElementById('clouds');
        const stars = document.getElementById('stars');

        function clearEffects() {
            rain.innerHTML = '';
            clouds.innerHTML = '';
            stars.innerHTML = '';
        }

        function setTheme(theme) {
            document.body.className = 'theme-' + theme;
            clearEffects();

            if (theme === 'rainy') {
                for (let i = 0; i < 80; i++) {
                    let drop = document.createElement('div');
                    drop.className = 'raindrop';
                    drop.style.left = Math.random() * 100 + 'vw';
                    drop.style.animationDuration = (Math.random() * 1 + 1.5) + 's';
                    rain.appendChild(drop);
                }
            } else if (theme === 'sunny') {
                for (let i = 0; i < 5; i++) {
                    let cloud = document.createElement('div');
                    cloud.className = 'cloud';
                    cloud.style.top = (i * 60) + 'px';
                    clouds.appendChild(cloud);
                }
            } else if (theme === 'night') {
                for (let i = 0; i < 100; i++) {
                    let star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + 'vw';
                    star.style.top = Math.random() * 100 + 'vh';
                    stars.appendChild(star);
                }
            }
        }

        function toggleChat() {
            const chat = document.getElementById('chatbox');
            chat.classList.toggle('collapsed');
            if (chat.classList.contains('collapsed')) {
                chat.style.height = '30px';
            } else {
                chat.style.height = '400px';
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const messages = document.getElementById('chat-messages');
            if (input.value.trim() !== '') {
                const msg = document.createElement('div');
                msg.textContent = input.value;
                messages.appendChild(msg);
                input.value = '';
                messages.scrollTop = messages.scrollHeight;
            }
        }

        window.onload = () => {
            setTheme('night');
        }
    </script>
</body>
</html>
