  <div class="container">
    <img src="images/lofigirlmain.png" alt="Lo-Fi Girl" class="lofi-girl">
    <h1>Lo-Fi Haven</h1>
    <p>დასვენდი და მოუსმინე საუკეთესო Lo-Fi მუსიკას. შეცვალე თემა შენი განწყობის მიხედვით და ითამაშე პატარა თამაში!</p>

    <!-- თემა შეცვლის ღილაკები -->
    <div>
      <button onclick="setTheme('rainy')">წვიმიანი</button>
      <button onclick="setTheme('sunny')">მზიანი</button>
      <button onclick="setTheme('night')">ღამის</button>
    </div>

    <!-- სოციალური ლინკები -->
    <div class="social-links">
      <a href="#" target="_blank">Instagram</a>
      <a href="#" target="_blank">YouTube</a>
      <a href="#" target="_blank">Discord</a>
    </div>

    <!-- აუდიო კონტროლები -->
    <div class="audio-controls">
      <audio id="lofiAudio" src="music/lofi.mp3" loop></audio>
      <button onclick="togglePlay()">▶️/⏸️</button>
      ხმის დონე: <input type="range" min="0" max="1" step="0.01" onchange="setVolume(this.value)">
    </div>

    <!-- ---- ახალი ნაწილი: TIC TAC TOE თამაში ---- -->
    <div class="tictactoe">
      <h2>ითამაშე X და 0 🎮</h2>

      <!-- სირთულის არჩევა -->
      <div class="difficulty-select">
        <label for="difficulty">აირჩიე სირთულე:</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="expert">Expert</option>
        </select>
      </div>

      <!-- სათამაშო დაფა -->
      <div class="board" id="board"></div>

      <!-- თამაშის სტატუსი -->
      <div id="status"></div>

      <!-- ახალი თამაშის დაწყების ღილაკი -->
      <button onclick="restartGame()">თავიდან დაწყება 🔄</button>
    </div>

  </div>

  <!-- დაფარვები: წვიმა, ღრუბლები, ვარსკვლავები -->
  <div class="rain" id="rain"></div>
  <div class="clouds" id="clouds"></div>
  <div class="stars" id="stars"></div>

  <!-- ჩატბოქსი -->
  <div class="chatbox">
    <div class="chat-header">ჩატი</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="დაწერე რამე...">
      <button onclick="sendMessage()">📨</button>
    </div>
  </div>

  <footer>
    © 2025 Lo-Fi Haven - ყველა უფლება დაცულია
  </footer>

  <!-- ყველა საჭირო სკრიპტი -->
  <script>
    // თემის შეცვლა
    function setTheme(theme) {
      document.body.className = 'theme-' + theme;
    }

    // მუსიკის გაშვება/შეჩერება
    const audio = document.getElementById('lofiAudio');
    function togglePlay() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }
    function setVolume(value) {
      audio.volume = value;
    }

    // წვიმის გენერაცია
    function createRain() {
      const rain = document.getElementById('rain');
      for (let i = 0; i < 100; i++) {
        const drop = document.createElement('div');
        drop.className = 'raindrop';
        drop.style.left = Math.random() * 100 + 'vw';
        drop.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
        drop.style.opacity = Math.random();
        rain.appendChild(drop);
      }
    }
    // ღრუბლების გენერაცია
    function createClouds() {
      const clouds = document.getElementById('clouds');
      for (let i = 0; i < 5; i++) {
        const cloud = document.createElement('div');
        cloud.className = 'cloud';
        cloud.style.top = Math.random() * 50 + 'vh';
        cloud.style.animationDuration = (Math.random() * 60 + 30) + 's';
        clouds.appendChild(cloud);
      }
    }
    // ვარსკვლავების გენერაცია
    function createStars() {
      const stars = document.getElementById('stars');
      for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        stars.appendChild(star);
      }
    }
    createRain();
    createClouds();
    createStars();

    // ჩატბოქსი
    function sendMessage() {
      const input = document.getElementById('chatInput');
      const messages = document.getElementById('chatMessages');
      if (input.value.trim() !== '') {
        const message = document.createElement('div');
        message.textContent = input.value;
        messages.appendChild(message);
        input.value = '';
        messages.scrollTop = messages.scrollHeight;
      }
    }

    // ==== TIC TAC TOE თამაში ====
    const board = document.getElementById('board');
    const statusDiv = document.getElementById('status');
    let cells = [];
    let currentPlayer = 'X';
    let isGameOver = false;

    function createBoard() {
      board.innerHTML = '';
      cells = [];
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.addEventListener('click', () => playerMove(i));
        board.appendChild(cell);
        cells.push('');
      }
      statusDiv.textContent = "შენი სვლა: X";
    }

    function playerMove(index) {
      if (cells[index] === '' && !isGameOver) {
        cells[index] = 'X';
        updateBoard();
        if (checkWinner('X')) {
          statusDiv.textContent = "მოგება! 🎉";
          isGameOver = true;
          return;
        }
        if (cells.every(cell => cell !== '')) {
          statusDiv.textContent = "ფრე!";
          isGameOver = true;
          return;
        }
        setTimeout(botMove, 500);
      }
    }

    function botMove() {
      let difficulty = document.getElementById('difficulty').value;
      let index;

      if (difficulty === 'easy') {
        const available = cells.map((val, idx) => val === '' ? idx : null).filter(v => v !== null);
        index = available[Math.floor(Math.random() * available.length)];
      } else if (difficulty === 'medium') {
        index = findBestMove('O') ?? randomMove();
      } else if (difficulty === 'expert') {
        index = minimax(cells, 'O').index;
      }

      if (index != null) {
        cells[index] = 'O';
        updateBoard();
        if (checkWinner('O')) {
          statusDiv.textContent = "დაგამარცხა ბოტმა 😔";
          isGameOver = true;
          return;
        }
        if (cells.every(cell => cell !== '')) {
          statusDiv.textContent = "ფრე!";
          isGameOver = true;
        }
      }
    }

    function updateBoard() {
      const cellElements = document.querySelectorAll('.cell');
      cells.forEach((value, index) => {
        cellElements[index].textContent = value;
      });
    }

    function checkWinner(player) {
      const winPatterns = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];
      return winPatterns.some(pattern => pattern.every(idx => cells[idx] === player));
    }

    function restartGame() {
      isGameOver = false;
      currentPlayer = 'X';
      createBoard();
    }

    function randomMove() {
      const available = cells.map((val, idx) => val === '' ? idx : null).filter(v => v !== null);
      return available[Math.floor(Math.random() * available.length)];
    }

    function findBestMove(player) {
      // Try to win
      for (let i = 0; i < cells.length; i++) {
        if (cells[i] === '') {
          cells[i] = player;
          if (checkWinner(player)) {
            cells[i] = '';
            return i;
          }
          cells[i] = '';
        }
      }
      // Block opponent
      const opponent = player === 'X' ? 'O' : 'X';
      for (let i = 0; i < cells.length; i++) {
        if (cells[i] === '') {
          cells[i] = opponent;
          if (checkWinner(opponent)) {
            cells[i] = '';
            return i;
          }
          cells[i] = '';
        }
      }
      return null;
    }

    function minimax(newBoard, player) {
      const availSpots = newBoard.map((val, idx) => val === '' ? idx : null).filter(v => v !== null);

      if (checkWinner('X')) {
        return {score: -10};
      } else if (checkWinner('O')) {
        return {score: 10};
      } else if (availSpots.length === 0) {
        return {score: 0};
      }

      const moves = [];
      for (let i = 0; i < availSpots.length; i++) {
        const move = {};
        move.index = availSpots[i];
        newBoard[availSpots[i]] = player;

        if (player === 'O') {
          move.score = minimax(newBoard, 'X').score;
        } else {
          move.score = minimax(newBoard, 'O').score;
        }

        newBoard[availSpots[i]] = '';
        moves.push(move);
      }

      let bestMove;
      if (player === 'O') {
        let bestScore = -Infinity;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score > bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      } else {
        let bestScore = Infinity;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score < bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      }

      return moves[bestMove];
    }

    createBoard(); // სტარტზე დაფის შექმნა
  </script>
</body>
</html>
