<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Avatar Creation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            padding: 30px;
        }

        #avatarCanvas {
            border: 2px solid #fff;
            border-radius: 20px;
            background-color: #333;
            margin-bottom: 20px;
        }

        .avatar-option {
            display: inline-block;
            cursor: pointer;
            margin: 10px;
        }

        .avatar-option img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #fff;
            transition: transform 0.3s ease;
        }

        .avatar-option img:hover {
            transform: scale(1.1);
        }

        .avatar-options {
            margin: 20px 0;
        }

        button {
            background-color: #ff4081;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #e73370;
        }
    </style>
</head>
<body>
    <h1>Create Your Lo-Fi Avatar</h1>

    <canvas id="avatarCanvas" width="300" height="300"></canvas>

    <div class="avatar-options">
        <h3>Select Hairstyle</h3>
        <div class="avatar-option" onclick="changeAvatar('hairstyle', 'hairstyle1')">
            <img src="https://example.com/hairstyle1.png" alt="Hairstyle 1">
        </div>
        <div class="avatar-option" onclick="changeAvatar('hairstyle', 'hairstyle2')">
            <img src="https://example.com/hairstyle2.png" alt="Hairstyle 2">
        </div>
        <div class="avatar-option" onclick="changeAvatar('hairstyle', 'hairstyle3')">
            <img src="https://example.com/hairstyle3.png" alt="Hairstyle 3">
        </div>
    </div>

    <div class="avatar-options">
        <h3>Select Outfit</h3>
        <div class="avatar-option" onclick="changeAvatar('outfit', 'outfit1')">
            <img src="https://example.com/outfit1.png" alt="Outfit 1">
        </div>
        <div class="avatar-option" onclick="changeAvatar('outfit', 'outfit2')">
            <img src="https://example.com/outfit2.png" alt="Outfit 2">
        </div>
        <div class="avatar-option" onclick="changeAvatar('outfit', 'outfit3')">
            <img src="https://example.com/outfit3.png" alt="Outfit 3">
        </div>
    </div>

    <div class="avatar-options">
        <h3>Select Face Style</h3>
        <div class="avatar-option" onclick="changeAvatar('face', 'face1')">
            <img src="https://example.com/face1.png" alt="Face 1">
        </div>
        <div class="avatar-option" onclick="changeAvatar('face', 'face2')">
            <img src="https://example.com/face2.png" alt="Face 2">
        </div>
        <div class="avatar-option" onclick="changeAvatar('face', 'face3')">
            <img src="https://example.com/face3.png" alt="Face 3">
        </div>
    </div>

    <button onclick="downloadAvatar()">Download Avatar</button>

    <script>
        const canvas = document.getElementById("avatarCanvas");
        const ctx = canvas.getContext("2d");

        let avatar = {
            hairstyle: null,
            outfit: null,
            face: null
        };

        // Change avatar parts
        function changeAvatar(type, part) {
            avatar[type] = part;
            updateAvatar();
        }

        // Update the avatar on the canvas
        function updateAvatar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear the canvas before redrawing

            // Draw hairstyle
            if (avatar.hairstyle) {
                let img = new Image();
                img.src = `https://example.com/${avatar.hairstyle}.png`;
                img.onload = function() {
                    ctx.drawImage(img, 50, 20, 200, 150); // Adjust positioning and size
                };
            }

            // Draw outfit
            if (avatar.outfit) {
                let img = new Image();
                img.src = `https://example.com/${avatar.outfit}.png`;
                img.onload = function() {
                    ctx.drawImage(img, 50, 150, 200, 150); // Adjust positioning and size
                };
            }

            // Draw face
            if (avatar.face) {
                let img = new Image();
                img.src = `https://example.com/${avatar.face}.png`;
                img.onload = function() {
                    ctx.drawImage(img, 50, 100, 200, 150); // Adjust positioning and size
                };
            }
        }

        // Download the avatar as an image
        function downloadAvatar() {
            const link = document.createElement("a");
            link.download = "lofi-avatar.png";
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
