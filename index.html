<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Billiards Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.14.2/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #333;
        }
        canvas {
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>
    <script>
        // Matter.js engine setup
        const { Engine, Render, Runner, World, Bodies, Body, Events } = Matter;

        // Create an engine
        const engine = Engine.create();
        const world = engine.world;

        // Create renderer
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: 800,
                height: 400,
                wireframes: false
            }
        });
        Render.run(render);

        // Create runner
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Create table (rectangle)
        const table = Bodies.rectangle(400, 200, 800, 400, {
            isStatic: true,
            render: {
                fillStyle: '#1e7028'
            }
        });
        World.add(world, table);

        // Create balls
        const ballRadius = 10;
        const balls = [];

        // Create the white ball
        const whiteBall = Bodies.circle(150, 200, ballRadius, {
            density: 0.05,
            render: {
                fillStyle: 'white'
            }
        });

        // Create other balls
        const colors = ['yellow', 'blue', 'red', 'green', 'purple', 'orange', 'brown', 'pink', 'black'];
        for (let i = 0; i < 8; i++) {
            balls.push(Bodies.circle(400 + i * 40, 200, ballRadius, {
                density: 0.05,
                render: {
                    fillStyle: colors[i % colors.length]
                }
            }));
        }

        // Add all balls to the world
        World.add(world, balls);
        World.add(world, whiteBall);

        // Create the cue stick (straight line)
        const cueStick = Bodies.rectangle(150, 200, 300, 5, {
            isStatic: true,
            render: {
                fillStyle: '#8B4513'
            }
        });
        World.add(world, cueStick);

        // Shoot ball based on mouse position
        let isShooting = false;
        canvas.addEventListener('click', function(e) {
            if (!isShooting) {
                const mouseX = e.clientX;
                const mouseY = e.clientY;
                const dx = mouseX - whiteBall.position.x;
                const dy = mouseY - whiteBall.position.y;
                const angle = Math.atan2(dy, dx);
                const force = 0.05;
                Body.applyForce(whiteBall, whiteBall.position, { x: force * Math.cos(angle), y: force * Math.sin(angle) });
                isShooting = true;
            }
        });

        // Ball collision and table boundaries
        Events.on(engine, 'collisionStart', function(event) {
            const pairs = event.pairs;
            pairs.forEach(pair => {
                if (pair.bodyA === whiteBall || pair.bodyB === whiteBall) {
                    isShooting = false;
                }
            });
        });

        // Run the engine and update the table
        Engine.run(engine);
    </script>
</body>
</html>
