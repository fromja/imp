<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Haven</title>
    <style>
        body {
            background-color: #121212;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #fff;
            overflow: hidden;
        }
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .header {
            font-size: 48px;
            font-weight: bold;
        }
        .subheader {
            font-size: 24px;
            margin: 10px 0;
        }
        .gif-container {
            position: relative;
            margin-top: 20px;
        }
        .cat-gif, .fireplace-gif {
            width: 500px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        #music {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Welcome to Lo-Fi Haven</div>
        <div class="subheader">Relax, enjoy the vibes, and chill.</div>
        
        <div class="gif-container">
            <img class="cat-gif" src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="cat">
            <img class="fireplace-gif" src="https://media.giphy.com/media/QDOowSyehlN5K/giphy.gif" alt="fireplace">
        </div>
    </div>

    <!-- Music -->
    <iframe id="music" src="https://www.youtube.com/embed/sF80I-TQiW0?autoplay=1&loop=1&playlist=sF80I-TQiW0" style="display:none;"></iframe>

    <script>
        // Play music automatically when the page loads
        window.onload = function() {
            const musicFrame = document.getElementById('music');
            if (musicFrame) musicFrame.src = musicFrame.src; // Reload to start autoplay
        }
    </script>
</body>
</html>
