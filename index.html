<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LofiHaven Chat</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #1e1e1e;
    color: #f0f0f0;
  }
  #chat-container {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 300px;
    background: #2c2c2c;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
  }
  #chat-messages {
    height: 300px;
    overflow-y: auto;
    padding: 10px;
    box-sizing: border-box;
  }
  #chat-input-area {
    display: flex;
    padding: 10px;
    background: #252525;
  }
  #chat-input-area input {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 5px;
    margin-right: 5px;
  }
  #chat-input-area button {
    padding: 8px 12px;
    background: #3aa3e3;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  .official-badge {
    display: inline-block;
    width: 18px;
    height: 18px;
    background-image: url('Images/891983a3-696d-4a21-bf10-8d0824df0163.png');
    background-size: contain;
    margin-left: 5px;
    vertical-align: middle;
  }
</style>
</head>
<body>

<div id="chat-container">
  <div id="chat-messages"></div>
  <div id="name-area">
    <input type="text" id="name-input" placeholder="Enter your name">
    <button onclick="setName()">Set</button>
  </div>
  <div id="chat-input-area" style="display: none;">
    <input type="text" id="chat-input" placeholder="Type a message">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
let username = "";
let verifiedUsers = ["LofiHaven", "IMPEXS"];
let secretPassword = "dND666666TDtu";

function setName() {
  let name = document.getElementById("name-input").value.trim();
  if (verifiedUsers.includes(name)) {
    let pass = prompt("Enter secret password to use this name:");
    if (pass !== secretPassword) {
      alert("Wrong password!");
      return;
    }
  }
  username = name;
  document.getElementById("name-area").style.display = "none";
  document.getElementById("chat-input-area").style.display = "flex";
}

function sendMessage() {
  let msg = document.getElementById("chat-input").value.trim();
  if (msg === "") return;
  let chat = document.getElementById("chat-messages");
  let newMsg = document.createElement("div");
  newMsg.innerHTML = `<strong>${username}</strong>${verifiedUsers.includes(username) ? '<span class='official-badge'></span>' : ''}: ${msg}`;
  chat.appendChild(newMsg);
  document.getElementById("chat-input").value = "";
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
