<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lo-Fi Haven</title>
  <link rel="icon" href="images/lofigirllogo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* შენი ძველი სტილები */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      transition: background-color 0.5s ease, color 0.5s ease;
      overflow-x: hidden;
    }
    .theme-rainy { background: linear-gradient(to bottom, #2e2e2e, #1e1e1e); color: #e0e0e0; }
    .theme-sunny { background: linear-gradient(to top, #fffbd5, #b20a2c); color: #1e1e1e; }
    .theme-night { background: linear-gradient(to top, #0f2027, #203a43, #2c5364); color: #e0e0e0; }

    .container {
      text-align: center;
      padding: 50px 20px;
      animation: fadeIn 1.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    h1 { font-size: 3em; margin-bottom: 20px; }
    p { font-size: 1.2em; max-width: 700px; margin: 20px auto; line-height: 1.8; }
    button {
      background-color: #ff4081;
      border: none;
      color: white;
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.3s;
    }
    button:hover { background-color: #e73370; }
    .social-links a {
      color: #ff4081;
      margin: 0 10px;
      text-decoration: none;
      font-size: 24px;
    }
    .lofi-girl {
      width: 300px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    .rain, .clouds, .stars {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: -1;
    }
    .raindrop {
      position: absolute;
      width: 2px;
      height: 50px;
      background: rgba(255, 255, 255, 0.3);
      animation: fall linear infinite;
      opacity: 0.5;
    }
    @keyframes fall { 0% { top: -60px; } 100% { top: 110vh; } }
    .cloud {
      position: absolute;
      width: 200px;
      height: 60px;
      background: #fff;
      border-radius: 100px;
      top: 50px;
      animation: cloudMove 60s linear infinite;
      opacity: 0.3;
    }
    @keyframes cloudMove { from { left: -250px; } to { left: 110%; }
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out alternate;
    }
    @keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }
    .official-badge {
      position: absolute;
      top: 10px;
      left: 20px;
      font-size: 1.1em;
      color: #ff4081;
      font-weight: bold;
      background: rgba(0,0,0,0.4);
      padding: 6px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      animation: fadeIn 2s ease-in-out;
    }
    .official-badge::after {
      content: '\2714';
      background: #3aa3e3;
      color: white;
      font-size: 0.9em;
      border-radius: 50%;
      padding: 2px 6px;
      margin-left: 5px;
    }
    .audio-controls {
      margin-top: 20px;
    }
    .audio-controls button {
      font-size: 20px;
      margin-right: 10px;
    }
    .audio-controls input[type="range"] {
      width: 150px;
      vertical-align: middle;
      margin-left: 10px;
    }
    .chatbox {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 300px;
      max-height: 400px;
      background: rgba(0,0,0,0.7);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: white;
      font-size: 14px;
    }
    .chat-header {
      background: #ff4081;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .chat-input {
      display: flex;
    }
    .chat-input input {
      flex: 1;
      padding: 10px;
      border: none;
    }
    .chat-input button {
      background: #ff4081;
      border: none;
      padding: 10px;
      color: white;
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
      color: #aaa;
    }
    /* ---- აქ დაამატე სტილი ტიკ-ტაკ-ტოესთვის ---- */
    .tictactoe {
      text-align: center;
      margin-top: 50px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-gap: 5px;
      margin: 20px auto;
      justify-content: center;
    }
    .cell {
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5em;
      cursor: pointer;
      border-radius: 10px;
    }
    .difficulty-select {
      margin-top: 20px;
    }
  </style>
</head>
<body class="theme-night">
  <div class="container">
    <img src="images/lofigirlmain.png" alt="Lo-Fi Girl" class="lofi-girl">
    <h1>Lo-Fi Haven</h1>
    <p>დასვენდი და მოუსმინე საუკეთესო Lo-Fi მუსიკას. შეცვალე თემა შენი განწყობის მიხედვით და ითამაშე პატარა თამაში!</p>

    <!-- თემა შეცვლის ღილაკები -->
    <div>
      <button onclick="setTheme('rainy')">წვიმიანი</button>
      <button onclick="setTheme('sunny')">მზიანი</button>
      <button onclick="setTheme('night')">ღამის</button>
    </div>

    <!-- სოციალური ლინკები -->
    <div class="social-links">
      <a href="#" target="_blank">Instagram</a>
      <a href="#" target="_blank">YouTube</a>
      <a href="#" target="_blank">Discord</a>
    </div>

    <!-- აუდიო კონტროლები -->
    <div class="audio-controls">
      <audio id="lofiAudio" src="music/lofi.mp3" loop></audio>
      <button onclick="togglePlay()">▶️/⏸️</button>
      ხმის დონე: <input type="range" min="0" max="1" step="0.01" onchange="setVolume(this.value)">
    </div>

    <!-- ---- ახალი ნაწილი: TIC TAC TOE თამაში ---- -->
    <div class="tictactoe">
      <h2>ითამაშე X და 0 🎮</h2>

      <!-- სირთულის არჩევა -->
      <div class="difficulty-select">
        <label for="difficulty">აირჩიე სირთულე:</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="expert">Expert</option>
        </select>
      </div>

      <!-- სათამაშო დაფა -->
      <div class="board" id="board"></div>

      <!-- თამაშის სტატუსი -->
      <div id="status"></div>

      <!-- ახალი თამაშის დაწყების ღილაკი -->
      <button onclick="restartGame()">თავიდან დაწყება 🔄</button>
    </div>

  </div>

  <!-- დაფარვები: წვიმა, ღრუბლები, ვარსკვლავები -->
  <div class="rain" id="rain"></div>
  <div class="clouds" id="clouds"></div>
  <div class="stars" id="stars"></div>

  <!-- ჩატბოქსი -->
  <div class="chatbox">
    <div class="chat-header">ჩატი</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="დაწერე რამე...">
      <button onclick="sendMessage()">📨</button>
    </div>
  </div>

  <footer>
    © 2025 Lo-Fi Haven - ყველა უფლება დაცულია
  </footer>

  <!-- ყველა საჭირო სკრიპტი -->
  <script>
    // თემის შეცვლა
    function setTheme(theme) {
      document.body.className = 'theme-' + theme;
    }

    // მუსიკის გაშვება/შეჩერება
    const audio = document.getElementById('lofiAudio');
    function togglePlay() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }
    function setVolume(value) {
      audio.volume = value;
    }

    // წვიმის გენერაცია
    function createRain() {
      const rain = document.getElementById('rain');
      for (let i = 0; i < 100; i++) {
        const drop = document.createElement('div');
        drop.className = 'raindrop';
        drop.style.left = Math.random() * 100 + 'vw';
        drop.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
        drop.style.opacity = Math.random();
        rain.appendChild(drop);
      }
    }
    // ღრუბლების გენერაცია
    function createClouds() {
      const clouds = document.getElementById('clouds');
      for (let i = 0; i < 5; i++) {
        const cloud = document.createElement('div');
        cloud.className = 'cloud';
        cloud.style.top = Math.random() * 50 + 'vh';
        cloud.style.animationDuration = (Math.random() * 60 + 30) + 's';
        clouds.appendChild(cloud);
      }
    }
    // ვარსკვლავების გენერაცია
    function createStars() {
      const stars = document.getElementById('stars');
      for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        stars.appendChild(star);
      }
    }
    createRain();
    createClouds();
    createStars();

    // ჩატბოქსი
    function sendMessage() {
      const input = document.getElementById('chatInput');
      const messages = document.getElementById('chatMessages');
      if (input.value.trim() !== '') {
        const message = document.createElement('div');
        message.textContent = input.value;
        messages.appendChild(message);
        input.value = '';
        messages.scrollTop = messages.scrollHeight;
      }
    }

    // ==== TIC TAC TOE თამაში ====
    const board = document.getElementById('board');
    const statusDiv = document.getElementById('status');
    let cells = [];
    let currentPlayer = 'X';
    let isGameOver = false;

    function createBoard() {
      board.innerHTML = '';
      cells = [];
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.addEventListener('click', () => playerMove(i));
        board.appendChild(cell);
        cells.push('');
      }
      statusDiv.textContent = "შენი სვლა: X";
    }

    function playerMove(index) {
      if (cells[index] === '' && !isGameOver) {
        cells[index] = 'X';
        updateBoard();
        if (checkWinner('X')) {
          statusDiv.textContent = "მოგება! 🎉";
          isGameOver = true;
          return;
        }
        if (cells.every(cell => cell !== '')) {
          statusDiv.textContent = "ფრე!";
          isGameOver = true;
          return;
        }
        setTimeout(botMove, 500);
      }
    }

    function botMove() {
      let difficulty = document.getElementById('difficulty').value;
      let index;

      if (difficulty === 'easy') {
        const available = cells.map((val, idx) => val === '' ? idx : null).filter(v => v !== null);
        index = available[Math.floor(Math.random() * available.length)];
      } else if (difficulty === 'medium') {
        index = findBestMove('O') ?? randomMove();
      } else if (difficulty === 'expert') {
        index = minimax(cells, 'O').index;
      }

      if (index != null) {
        cells[index] = 'O';
        updateBoard();
        if (checkWinner('O')) {
          statusDiv.textContent = "დაგამარცხა ბოტმა 😔";
          isGameOver = true;
          return;
        }
        if (cells.every(cell => cell !== '')) {
          statusDiv.textContent = "ფრე!";
          isGameOver = true;
        }
      }
    }

    function updateBoard() {
      const cellElements = document.querySelectorAll('.cell');
      cells.forEach((value, index) => {
        cellElements[index].textContent = value;
      });
    }

    function checkWinner(player) {
      const winPatterns = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];
      return winPatterns.some(pattern => pattern.every(idx => cells[idx] === player));
    }

    function restartGame() {
      isGameOver = false;
      currentPlayer = 'X';
      createBoard();
    }

    function randomMove() {
      const available = cells.map((val, idx) => val === '' ? idx : null).filter(v => v !== null);
      return available[Math.floor(Math.random() * available.length)];
    }

    function findBestMove(player) {
      // Try to win
      for (let i = 0; i < cells.length; i++) {
        if (cells[i] === '') {
          cells[i] = player;
          if (checkWinner(player)) {
            cells[i] = '';
            return i;
          }
          cells[i] = '';
        }
      }
      // Block opponent
      const opponent = player === 'X' ? 'O' : 'X';
      for (let i = 0; i < cells.length; i++) {
        if (cells[i] === '') {
          cells[i] = opponent;
          if (checkWinner(opponent)) {
            cells[i] = '';
            return i;
          }
          cells[i] = '';
        }
      }
      return null;
    }

    function minimax(newBoard, player) {
      const availSpots = newBoard.map((val, idx) => val === '' ? idx : null).filter(v => v !== null);

      if (checkWinner('X')) {
        return {score: -10};
      } else if (checkWinner('O')) {
        return {score: 10};
      } else if (availSpots.length === 0) {
        return {score: 0};
      }

      const moves = [];
      for (let i = 0; i < availSpots.length; i++) {
        const move = {};
        move.index = availSpots[i];
        newBoard[availSpots[i]] = player;

        if (player === 'O') {
          move.score = minimax(newBoard, 'X').score;
        } else {
          move.score = minimax(newBoard, 'O').score;
        }

        newBoard[availSpots[i]] = '';
        moves.push(move);
      }

      let bestMove;
      if (player === 'O') {
        let bestScore = -Infinity;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score > bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      } else {
        let bestScore = Infinity;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score < bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      }

      return moves[bestMove];
    }

    createBoard(); // სტარტზე დაფის შექმნა
  </script>
</body>
</html>
