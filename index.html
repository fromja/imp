          <button type="submit" class="chat-form-submit fill-on-hover">

        </div>

    <div class="model option-box-item option-box-message">

        <div class="flex columns width-full">

          <div class="msg-text">

          </div>
        </div>
        <div class="msg-time">

        </div>
      </div>

            </a>
            <a class="p-track-title preview-track-title needTrackUrl"  href="#" target="_blank">

            </a>
            <a class="p-track-artist preview-track-artists needTrackUrl"  href="#" target="_blank">

            </a>
          </div>
          <div class="flex columns ">
            <a class="flex left pl-btn addToPlaylistAction needTrackId swap-on-hover" href="#">
              <i class="ph ph-plus-circle mr-1"></i>

            <a class="flex left pl-btn spotify-url likeAction needTrackId fill-on-hover" data-to="spotify" href="#">
              <i class="ph ph-spotify-logo mr-1"></i>

          <div class="ch-dialog-footer flex centered">
            <a href="#" class="pl-btn close-dialogs close-modal p2 mt-1 mb-1">
