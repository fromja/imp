<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>კონტაქტი</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>კონტაქტი</h2>
        <form id="my-form" action="YOUR_FORM_ACTION_URL" method="POST">
            <input type="text" name="your-name" required placeholder="თქვენი სახელი">
            <input type="email" name="your-email" required placeholder="თქვენი მეილი">
            <textarea name="your-message" required placeholder="მესიჯი"></textarea>
            <button type="submit">გაგზავნა</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        var form = document.getElementById("my-form");
        var status = document.getElementById("status");

        async function handleSubmit(event) {
            event.preventDefault();
            var data = new FormData(event.target);
            fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                status.innerHTML = "მადლობა, თქვენი მესიჯი მიღებულია!";
                status.classList.add("success");
                form.reset();
            }).catch(error => {
                status.innerHTML = "დაფიქსირდა შეცდომა, ცადეთ თავიდან.";
                status.classList.add("error");
            });
        }
        
        form.addEventListener("submit", handleSubmit);
    </script>
</body>
</html>
