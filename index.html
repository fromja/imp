<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Haven</title>
    <style>
        body {
            background-color: #121212;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: #ffffff;
        }
        #gameCanvas {
            position: absolute;
            bottom: 0;
            left: 0;
            border: 2px solid #fff;
            display: block;
            background-color: #222;
        }
        .raindrop, .cloud, .star {
            position: absolute;
            background-color: #fff;
        }
        .raindrop {
            width: 2px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.6);
            animation: rain 2s infinite linear;
        }
        .cloud {
            width: 80px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: cloudMove 10s linear infinite;
        }
        .star {
            width: 2px;
            height: 2px;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 1s infinite alternate;
        }
        @keyframes rain {
            from { transform: translateY(-100vh); }
            to { transform: translateY(100vh); }
        }
        @keyframes cloudMove {
            from { transform: translateX(-100vw); }
            to { transform: translateX(100vw); }
        }
        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1 id="welcome-text">Welcome to Lo-Fi Haven</h1>
    <p id="welcome-paragraph">Dive into a world of calm. Whether you're studying, working, or just relaxing — Lo-Fi Haven is here to bring peace through mellow beats, cozy visuals, and a soothing atmosphere that feels like home.</p>

    <!-- Canvas for game -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Score -->
    <div id="score">Score: 0</div>

    <!-- Weather effects -->
    <div id="rain"></div>
    <div id="clouds"></div>
    <div id="stars"></div>

    <!-- Music -->
    <iframe id="music" src="https://www.youtube.com/embed/sF80I-TQiW0?autoplay=1&loop=1&playlist=sF80I-TQiW0" style="display:none;"></iframe>

    <script>
        let score = 0;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ball = { x: 150, y: 150, radius: 15, dx: 0, dy: 0, color: 'rgb(255, 255, 255)' };
        const paddle = { width: 75, height: 10, x: 150, y: 380, speed: 7, dx: 0 };
        let leftPressed = false, rightPressed = false;

        // Function to play music
        function playMusic() {
            const musicFrame = document.getElementById('music');
            if (musicFrame) musicFrame.src = musicFrame.src; // Reload to start autoplay
        }

        // Start the game
        function startLofiGame() {
            function drawBall() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.closePath();
            }

            function drawPaddle() {
                ctx.beginPath();
                ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
                ctx.fillStyle = "#ff4081";
                ctx.fill();
                ctx.closePath();
            }

            function moveBall() {
                ball.x += ball.dx;
                ball.y += ball.dy;

                // Wall collisions
                if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                    ball.dx = -ball.dx;
                }
                if (ball.y + ball.dy < ball.radius) {
                    ball.dy = -ball.dy;
                }
                if (ball.y + ball.dy > canvas.height - ball.radius) {
                    if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                        ball.dy = -ball.dy;
                        score++;
                        document.getElementById('score').textContent = 'Score: ' + score;
                    } else {
                        alert('Game Over!');
                        score = 0;
                        document.getElementById('score').textContent = 'Score: ' + score;
                        ball.x = 150;
                        ball.y = 150;
                        ball.dx = 0;
                        ball.dy = 0;
                    }
                }
            }

            function movePaddle() {
                if (leftPressed && paddle.x > 0) {
                    paddle.x -= paddle.speed;
                }
                if (rightPressed && paddle.x < canvas.width - paddle.width) {
                    paddle.x += paddle.speed;
                }
            }

            function gameLoop() {
                drawBall();
                drawPaddle();
                moveBall();
                movePaddle();
                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        }

        // Event listeners for paddle movement
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowLeft') leftPressed = true;
            if (event.key === 'ArrowRight') rightPressed = true;
        });

        document.addEventListener('keyup', function(event) {
            if (event.key === 'ArrowLeft') leftPressed = false;
            if (event.key === 'ArrowRight') rightPressed = false;
        });

        // Weather effects: Rain, Clouds, Stars
        function createWeatherEffect() {
            const rain = document.getElementById('rain');
            const clouds = document.getElementById('clouds');
            const stars = document.getElementById('stars');

            // Clear previous effects
            rain.innerHTML = '';
            clouds.innerHTML = '';
            stars.innerHTML = '';

            for (let i = 0; i < 100; i++) {
                const raindrop = document.createElement('div');
                raindrop.className = 'raindrop';
                raindrop.style.left = Math.random() * 100 + 'vw';
                raindrop.style.animationDuration = Math.random() * 2 + 2 + 's';
                rain.appendChild(raindrop);
            }

            for (let i = 0; i < 2; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.style.left = Math.random() * 100 + 'vw';
                clouds.appendChild(cloud);
            }

            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDuration = Math.random() * 3 + 's';
                stars.appendChild(star);
            }
        }

        // Call functions to start everything
        playMusic();
        createWeatherEffect();
        startLofiGame();
    </script>
</body>
</html>
