<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lo-Fi Haven</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(to bottom, #1e1e2f, #2d2d44);
      color: white;
      overflow-x: hidden;
    }
    header {
      display: flex;
      align-items: center;
      padding: 1rem;
      font-size: 1.2rem;
    }
    .logo {
      font-weight: 900;
      font-size: 1.2rem;
      animation: pulse 2s infinite;
      position: fixed;
      top: 1rem;
      left: 1rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 12px;
    }
    .logo::after {
      content: ' ✔️';
      color: #4ecdc4;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    #chatbox-toggle {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 1000;
      background-color: #4ecdc4;
      color: black;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      cursor: pointer;
    }
    #chatbox {
      display: none;
      position: fixed;
      bottom: 3rem;
      right: 1rem;
      width: 300px;
      max-height: 400px;
      background: #333;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      overflow: hidden;
      z-index: 999;
      display: flex;
      flex-direction: column;
    }
    #chat-messages {
      flex-grow: 1;
      overflow-y: auto;
      padding: 0.5rem;
      font-size: 0.9rem;
    }
    #chat-input {
      display: flex;
      border-top: 1px solid #444;
    }
    #chat-input input {
      flex-grow: 1;
      padding: 0.5rem;
      background: #222;
      border: none;
      color: white;
    }
    #chat-input button {
      padding: 0.5rem 1rem;
      background: #4ecdc4;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Lofi Haven Official</div>
  </header>

  <!-- Chat -->
  <div id="chatbox-toggle">💬 Chat</div>
  <div id="chatbox">
    <div id="chat-messages"></div>
    <div id="chat-input">
      <input type="text" id="chat-username" placeholder="Your name" />
    </div>
    <div id="chat-input">
      <input type="text" id="chat-message" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('chatbox-toggle');
    const chatBox = document.getElementById('chatbox');
    const chatMessages = document.getElementById('chat-messages');
    const usernameInput = document.getElementById('chat-username');
    const messageInput = document.getElementById('chat-message');

    toggleBtn.addEventListener('click', () => {
      chatBox.style.display = chatBox.style.display === 'flex' ? 'none' : 'flex';
    });

    function sendMessage() {
      const username = usernameInput.value.trim();
      const message = messageInput.value.trim();
      if (!username || !message) return;
      const msg = document.createElement('div');
      msg.innerHTML = `<strong>${username}:</strong> ${message}`;
      chatMessages.appendChild(msg);
      messageInput.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    messageInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
