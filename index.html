<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ultimate Billiards</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #2d2d2d;
    }
    canvas {
      display: block;
      background: #165016;
    }
  </style>
</head>
<body>
<script>
const { Engine, Render, Runner, World, Bodies, Body, Composite, Constraint, Events, Mouse, MouseConstraint, Vector } = Matter;

// Engine and world setup
const engine = Engine.create();
const world = engine.world;
world.gravity.y = 0;

// Renderer
const render = Render.create({
  element: document.body,
  engine: engine,
  options: {
    width: 1000,
    height: 500,
    wireframes: false,
    background: '#165016'
  }
});
Render.run(render);

// Runner
Runner.run(Runner.create(), engine);

// Table boundaries
const thickness = 30;
const width = 1000;
const height = 500;

// Walls
const walls = [
  Bodies.rectangle(width/2, -thickness/2, width, thickness, { isStatic: true }),
  Bodies.rectangle(width/2, height+thickness/2, width, thickness, { isStatic: true }),
  Bodies.rectangle(-thickness/2, height/2, thickness, height, { isStatic: true }),
  Bodies.rectangle(width+thickness/2, height/2, thickness, height, { isStatic: true })
];
World.add(world, walls);

// Pockets (luzes)
const pocketSize = 30;
const pockets = [
  { x: 0, y: 0 },
  { x: width/2, y: 0 },
  { x: width, y: 0 },
  { x: 0, y: height },
  { x: width/2, y: height },
  { x: width, y: height }
];

pockets.forEach(p => {
  const pocket = Bodies.circle(p.x, p.y, pocketSize, {
    isSensor: true,
    isStatic: true,
    render: {
      fillStyle: 'black'
    }
  });
  World.add(world, pocket);
});

// Balls
const ballRadius = 10;
const colors = ['yellow', 'blue', 'red', 'purple', 'orange', 'green', 'brown', 'pink', 'black', 'yellow', 'blue', 'red', 'purple', 'orange', 'green', 'white'];

let balls = [];

// Place balls in triangle
const startX = width * 0.75;
const startY = height / 2;
let ballCount = 0;
for (let row = 0; row < 5; row++) {
  for (let i = 0; i <= row; i++) {
    if (ballCount >= colors.length - 1) break;
    const ball = Bodies.circle(
      startX + row * (ballRadius * 2) * Math.cos(Math.PI / 6),
      startY + (i * 2 - row) * ballRadius * 2 * Math.sin(Math.PI / 6),
      ballRadius,
      {
        restitution: 0.9,
        friction: 0.002,
        density: 0.04,
        render: { fillStyle: colors[ballCount] }
      }
    );
    balls.push(ball);
    ballCount++;
  }
}

// Cue ball
const cueBall = Bodies.circle(width * 0.25, height/2, ballRadius, {
  restitution: 0.9,
  friction: 0.002,
  density: 0.04,
  render: { fillStyle: 'white' }
});
balls.push(cueBall);

World.add(world, balls);

// Cue stick variables
let mouse = Mouse.create(render.canvas);
let mouseConstraint = MouseConstraint.create(engine, {
  mouse: mouse,
  constraint: { stiffness: 0.2, render: { visible: false } }
});
World.add(world, mouseConstraint);

let isAiming = false;
let cueStick = null;

// Drawing cue stick manually
Events.on(render, 'afterRender', function() {
  if (isAiming) {
    const ctx = render.context;
    ctx.beginPath();
    ctx.moveTo(cueBall.position.x, cueBall.position.y);
    ctx.lineTo(mouse.position.x, mouse.position.y);
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
});

// Mouse down to aim
mouseConstraint.mouse.element.addEventListener('mousedown', (event) => {
  if (Vector.magnitude(Vector.sub(mouse.position, cueBall.position)) < 100) {
    isAiming = true;
  }
});

// Mouse up to shoot
mouseConstraint.mouse.element.addEventListener('mouseup', (event) => {
  if (isAiming) {
    const forceMagnitude = 0.02;
    const direction = Vector.normalise(Vector.sub(cueBall.position, mouse.position));
    Body.applyForce(cueBall, cueBall.position, Vector.mult(direction, forceMagnitude));
    isAiming = false;
  }
});

// Remove balls that fall into pockets
Events.on(engine, 'beforeUpdate', function() {
  balls.forEach(ball => {
    pockets.forEach(pocket => {
      const dist = Vector.magnitude(Vector.sub(ball.position, pocket));
      if (dist < pocketSize) {
        World.remove(world, ball);
      }
    });
  });
});

</script>
</body>
</html>
