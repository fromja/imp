<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Haven</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="background">
        <div class="weather-effects" id="weather-effects"></div>
        <div class="header">
            <h1 class="title">Welcome to Lo-Fi Haven</h1>
            <div class="lang-toggle">
                <button onclick="changeLanguage('en')">English</button>
                <button onclick="changeLanguage('ka')">ქართული</button>
            </div>
        </div>

        <div class="content">
            <section id="about">
                <h2 data-en="About Us" data-ka="ჩვენს შესახებ">About Us</h2>
                <p data-en="Welcome to Lo-Fi Haven, a peaceful place to relax, learn, and connect through lo-fi music." data-ka="ლო-ფი ჰევენი არის მშვიდი ადგილი, სადაც შეგიძლიათ დაისვენოთ, ისწავლოთ და გაიცნოთ სხვები ლო-ფი მუსიკის მეშვეობით.">
                    Welcome to Lo-Fi Haven, a peaceful place to relax, learn, and connect through lo-fi music.
                </p>
            </section>

            <section id="community">
                <h2 data-en="Our Community" data-ka="ჩვენი კომუნიტეტი">Our Community</h2>
                <p data-en="Join our amazing community of people who love lo-fi beats, gaming, education, and more." data-ka="მოერთით ჩვენს საოცარ კომუნიტეტს, სადაც ადამიანები გიყვართ ლო-ფი ბითები, თამაშები, განათლება და სხვა.">
                    Join our amazing community of people who love lo-fi beats, gaming, education, and more.
                </p>
            </section>

            <section id="gallery">
                <h2 data-en="Gallery" data-ka="გალერეა">Gallery</h2>
                <div class="gallery">
                    <img src="https://via.placeholder.com/300" alt="Lo-fi Girl" class="lofi-image">
                    <img src="https://via.placeholder.com/300" alt="Lo-fi Landscape" class="lofi-image">
                    <!-- Add more lo-fi images here -->
                </div>
            </section>

            <section id="music">
                <h2 data-en="Lo-Fi Music" data-ka="ლო-ფი მუსიკა">Lo-Fi Music</h2>
                <iframe id="lofi-music" width="100%" height="90" src="https://www.youtube.com/embed/sF80I-TQiW0?autoplay=1&loop=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </section>
        </div>
    </div>
</body>
</html>

<style>
    /* Main page layout */
    body {
        font-family: 'Arial', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #1e1e1e;
        color: white;
    }

    .background {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    .header {
        text-align: center;
        padding: 50px;
    }

    .header .title {
        font-size: 3em;
        margin-bottom: 20px;
    }

    .lang-toggle button {
        background-color: rgba(255, 255, 255, 0.3);
        border: none;
        padding: 10px;
        margin: 5px;
        cursor: pointer;
    }

    .lang-toggle button:hover {
        background-color: rgba(255, 255, 255, 0.6);
    }

    .content {
        padding: 20px;
        text-align: center;
    }

    .content section {
        margin-bottom: 50px;
    }

    .gallery {
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    .gallery img {
        border-radius: 10px;
        width: 300px;
        height: 200px;
        object-fit: cover;
    }

    /* Weather Effects */
    .weather-effects {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    .raindrop {
        position: absolute;
        width: 2px;
        height: 50px;
        background: rgba(255, 255, 255, 0.3);
        animation: fall linear infinite;
        opacity: 0.5;
    }

    @keyframes fall {
        0% { top: -60px; }
        100% { top: 110vh; }
    }
</style>

<script>
    // Change Language
    function changeLanguage(lang) {
        const elements = document.querySelectorAll("[data-en], [data-ka]");
        elements.forEach(element => {
            const langText = element.getAttribute(`data-${lang}`);
            element.innerText = langText;
        });
    }

    // Generate Rainy Day Effect
    function generateRainEffect() {
        const container = document.getElementById('weather-effects');
        for (let i = 0; i < 100; i++) {
            const raindrop = document.createElement('div');
            raindrop.classList.add('raindrop');
            raindrop.style.left = `${Math.random() * 100}vw`;
            raindrop.style.animationDuration = `${Math.random() * 2 + 2}s`;
            container.appendChild(raindrop);
        }
    }

    // Initialize Weather Effects
    window.onload = function () {
        generateRainEffect();
    };
</script>
