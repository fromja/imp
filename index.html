<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lo-Fi Haven</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #1e1e2f;
      color: white;
      overflow-x: hidden;
    }
    header, footer {
      text-align: center;
      padding: 1em;
      background: #2c2c3c;
    }
    .section {
      padding: 2em;
      text-align: center;
    }
    select, button {
      padding: 0.5em;
      margin: 0.5em;
      border-radius: 8px;
      border: none;
      background-color: #333;
      color: white;
      font-size: 1em;
    }
    .generator-preview {
      width: 120px;
      height: 120px;
      border-radius: 60px;
      margin: auto;
      background-color: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
    }
    .lofi-character {
      font-size: 2em;
    }
    #background-visual {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }
  </style>
</head>
<body>

<header>
  <h1>Lo-Fi Haven 🎧</h1>
</header>

<!-- Ambient Selector -->
<section class="section">
  <h2>🌦 Ambient Selector</h2>
  <select id="ambient">
    <option value="none">Select Ambience</option>
    <option value="rain">Rain</option>
    <option value="forest">Forest</option>
    <option value="night">Night Sky</option>
    <option value="cafe">Coffee Shop</option>
  </select>
</section>

<!-- Background Animation Canvas -->
<div id="background-visual"></div>

<!-- Lofi Art Generator -->
<section class="section">
  <h2>🎨 Lofi Art Generator</h2>
  <div class="generator-preview" id="avatarPreview">🙂</div>
  <select id="hair">
    <option value="🧑‍🦱">Curly Hair</option>
    <option value="🧑‍🦰">Wavy Hair</option>
    <option value="🧑‍🦲">Bald</option>
    <option value="🧑‍🦳">Silver Hair</option>
  </select>
  <select id="face">
    <option value="🙂">Smile</option>
    <option value="😎">Cool</option>
    <option value="😴">Sleepy</option>
    <option value="🤓">Nerd</option>
  </select>
  <select id="background">
    <option value="🌌">Night Sky</option>
    <option value="🌲">Forest</option>
    <option value="☕">Cafe</option>
    <option value="🌧️">Rain</option>
  </select>
  <br />
  <button onclick="generateAvatar()">Generate Avatar</button>
</section>

<!-- Footer -->
<footer>
  <p>Official Lo-Fi Haven &copy; 2025</p>
</footer>

<!-- Scripts -->
<script>
  const avatarPreview = document.getElementById('avatarPreview');

  function generateAvatar() {
    const hair = document.getElementById('hair').value;
    const face = document.getElementById('face').value;
    const background = document.getElementById('background').value;
    avatarPreview.innerText = background + ' ' + hair + ' ' + face;
  }

  const ambient = document.getElementById('ambient');
  const bgVisual = document.getElementById('background-visual');

  ambient.addEventListener('change', () => {
    const value = ambient.value;
    bgVisual.innerHTML = ''; // Clear previous visuals

    if (value === 'rain') {
      for (let i = 0; i < 100; i++) {
        const drop = document.createElement('div');
        drop.style.position = 'absolute';
        drop.style.top = Math.random() * 100 + '%';
        drop.style.left = Math.random() * 100 + '%';
        drop.style.width = '2px';
        drop.style.height = '20px';
        drop.style.background = 'rgba(255,255,255,0.2)';
        drop.style.animation = 'fall 1s linear infinite';
        drop.style.animationDelay = `${Math.random()}s`;
        bgVisual.appendChild(drop);
      }
    } else if (value === 'night') {
      for (let i = 0; i < 80; i++) {
        const star = document.createElement('div');
        star.style.position = 'absolute';
        star.style.top = Math.random() * 100 + '%';
        star.style.left = Math.random() * 100 + '%';
        star.style.width = '2px';
        star.style.height = '2px';
        star.style.background = 'white';
        star.style.borderRadius = '50%';
        star.style.opacity = Math.random();
        bgVisual.appendChild(star);
      }
    } else if (value === 'forest') {
      bgVisual.style.backgroundImage = "url('https://i.imgur.com/4M7IWwP.jpg')";
      bgVisual.style.backgroundSize = 'cover';
    } else if (value === 'cafe') {
      bgVisual.style.backgroundImage = "url('https://i.imgur.com/IlWJUPz.jpg')";
      bgVisual.style.backgroundSize = 'cover';
    } else {
      bgVisual.style.backgroundImage = 'none';
    }
  });
</script>

<style>
  @keyframes fall {
    to {
      transform: translateY(100vh);
    }
  }
</style>

</body>
</html>
