<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lo-Fi Haven</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e2f;
      color: #fff;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      font-size: 18px;
      background: transparent;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      animation: fadeIn 2s ease;
    }

    .header span {
      margin-left: 10px;
      font-weight: bold;
      color: #ffcad4;
      font-size: 20px;
      animation: glow 3s infinite ease-in-out;
    }

    .verify {
      margin-left: 8px;
      font-size: 20px;
      color: #00aaff;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 5px #ffcad4; }
      50% { text-shadow: 0 0 20px #ffcad4; }
      100% { text-shadow: 0 0 5px #ffcad4; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .chatbox-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ffcad4;
      color: #333;
      border: none;
      padding: 10px 15px;
      border-radius: 30px;
      cursor: pointer;
      z-index: 999;
      font-weight: bold;
    }

    .chatbox {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 300px;
      height: 400px;
      background: #2e2e3e;
      border-radius: 10px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      z-index: 999;
    }

    .chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      background: #3e3e50;
    }

    .chat-input input {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
    }

    .chat-input button {
      padding: 8px 12px;
      background: #ffcad4;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .chat-message {
      margin-bottom: 10px;
    }

    .chat-message span {
      font-weight: bold;
      color: #00aaff;
    }

    #usernameModal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    #usernameModal input {
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }

    #usernameModal button {
      padding: 10px 20px;
      margin-left: 10px;
      background-color: #ffcad4;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" width="24" height="24" />
    <span>Lofi Haven Official</span>
    <span class="verify">✔️</span>
  </div>

  <!-- Username Modal -->
  <div id="usernameModal">
    <input type="text" id="usernameInput" placeholder="Enter your name" />
    <button onclick="setUsername()">Join</button>
  </div>

  <!-- Chat Button -->
  <button class="chatbox-toggle" onclick="toggleChat()">💬 Chat</button>

  <!-- Chatbox -->
  <div class="chatbox" id="chatbox">
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter'){sendMessage()}" />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let username = "";

    function setUsername() {
      const input = document.getElementById("usernameInput");
      if (input.value.trim() !== "") {
        username = input.value.trim();
        document.getElementById("usernameModal").style.display = "none";
      }
    }

    function toggleChat() {
      const chatbox = document.getElementById("chatbox");
      chatbox.style.display = chatbox.style.display === "none" ? "flex" : "none";
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const message = input.value.trim();
      if (message !== "") {
        const messages = document.getElementById("messages");
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("chat-message");
        msgDiv.innerHTML = `<span>${username}:</span> ${formatEmojis(message)}`;
        messages.appendChild(msgDiv);
        input.value = "";
        messages.scrollTop = messages.scrollHeight;
      }
    }

    function formatEmojis(text) {
      return text.replace(/:([a-zA-Z0-9_+-]+):/g, (match, p1) => {
        return `😊`;
      });
    }
  </script>
</body>
</html>
