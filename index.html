<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lo-Fi Haven</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #2c2c54, #1e1e2f);
      color: #fff;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      padding: 2rem;
      font-size: 2.5rem;
      background: rgba(0, 0, 0, 0.3);
    }
    section {
      padding: 2rem;
      max-width: 1000px;
      margin: auto;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    .gallery img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .avatar-generator {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      background: #1f1f30;
      padding: 2rem;
      border-radius: 16px;
      margin-top: 2rem;
    }
    .avatar-preview {
      background: #2e2e4a;
      padding: 1rem;
      border-radius: 12px;
    }
    .avatar-controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 200px;
    }
    select, button {
      padding: 0.5rem;
      border-radius: 6px;
      border: none;
    }
    button {
      background: #4d4dff;
      color: white;
      cursor: pointer;
    }
    footer {
      text-align: center;
      padding: 1rem;
      background: #111;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>Lo-Fi Haven</header>

  <section>
    <h2>Gallery</h2>
    <div class="gallery">
      <img src="https://placekitten.com/300/200" alt="Lofi art 1">
      <img src="https://placekitten.com/301/200" alt="Lofi art 2">
      <img src="https://placekitten.com/302/200" alt="Lofi art 3">
    </div>
  </section>

  <section>
    <h2>Create Your Lofi Avatar</h2>
    <div class="avatar-generator">
      <div class="avatar-preview" id="avatarPreview">
        <img id="avatarImage" src="https://via.placeholder.com/150?text=Your+Avatar" alt="Avatar" width="150">
      </div>
      <div class="avatar-controls">
        <label>
          Hair:
          <select id="hairSelect">
            <option value="blonde">Blonde</option>
            <option value="black">Black</option>
            <option value="pink">Pink</option>
          </select>
        </label>
        <label>
          Eyes:
          <select id="eyesSelect">
            <option value="green">Green</option>
            <option value="blue">Blue</option>
            <option value="brown">Brown</option>
          </select>
        </label>
        <label>
          Background:
          <select id="bgSelect">
            <option value="night">Night</option>
            <option value="sunset">Sunset</option>
            <option value="rain">Rain</option>
          </select>
        </label>
        <button onclick="downloadAvatar()">Download Avatar</button>
      </div>
    </div>
  </section>

  <footer>
    Official Lo-Fi Haven © 2025
  </footer>

  <script>
    function downloadAvatar() {
      const canvas = document.createElement('canvas');
      canvas.width = 150;
      canvas.height = 150;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#333';
      ctx.fillRect(0, 0, 150, 150);

      const hair = document.getElementById('hairSelect').value;
      const eyes = document.getElementById('eyesSelect').value;
      const bg = document.getElementById('bgSelect').value;

      ctx.fillStyle = '#fff';
      ctx.font = '12px sans-serif';
      ctx.fillText(`Hair: ${hair}`, 10, 50);
      ctx.fillText(`Eyes: ${eyes}`, 10, 70);
      ctx.fillText(`BG: ${bg}`, 10, 90);

      const link = document.createElement('a');
      link.download = 'lofi-avatar.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
