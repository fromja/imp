<!DOCTYPE html>
<html lang="en">
<head>  
  <title>Lofi Haven ✪</title>
  <meta charset="UTF-8">
  <meta name="description" content="Lofi Haven Discord Server">
  <meta name="keywords" content="lofi, discord, cyber security, tech">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link rel="stylesheet" href="https://use.typekit.net/utg8fym.css">
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700,800&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="images/logotest.png">    
  
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }
    body.dark-mode {
      background-color: #0e0e0e;
      color: #eee;
    }
    .lang-toggle, .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      margin-left: 10px;
      z-index: 999;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    #rain-effect {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }
    .logo img {
      height: 50px;
    }
    .hero {
      padding: 100px 20px;
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
    }
  </style>
</head> 
<body> 

<!-- LANGUAGE AND THEME TOGGLE -->
<button class="lang-toggle" onclick="toggleLanguage()">🌐 Geo/Eng</button>
<button class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Theme</button>
<canvas id="rain-effect"></canvas>

<!-- LOADER -->
<div class="loader-wrapper">
  <div class="preloader"></div>
</div>

<main>

<!-- HEADER SECTION -->
<header>
  <a href="index.html" class="logo">
    <img src="images/logotest.png" alt="Lofi Haven Logo">
  </a>
</header>

<!-- HOME SECTION -->
<section id="hero" class="hero" style="background-image: url(images/loficity.jpg);">
  <div class="container">
    <span class="hero-little">Lofi Haven Official</span>
    <h1 class="hero-title">შემოგვიერთდი და<br> <span id="element">მშვიდი ციფრული თავშესაფარი შენთვის</span>.</h1>
    <p style="max-width: 600px; margin: 0 auto;">
      Immerse yourself in a soothing digital escape. Whether you're learning cybersecurity, coding, or just need peace, Lofi Haven is your cozy corner of the internet. Let's grow together, one calm beat at a time.
    </p>
  </div>
</section>

</main>

<script>
  function toggleTheme() {
    document.body.classList.toggle("dark-mode");
    const canvas = document.getElementById("rain-effect");
    canvas.style.display = document.body.classList.contains("dark-mode") ? 'block' : 'none';
  }

  function toggleLanguage() {
    document.body.classList.toggle("lang-georgian");
    document.body.classList.toggle("lang-english");
  }

  // Rain effect
  const canvas = document.getElementById("rain-effect");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const drops = Array(300).fill().map(() => ({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, l: Math.random()*1.5+0.5, xs: -4 + Math.random()*4 + 2, ys: Math.random()*10 + 10 }));

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "rgba(174,194,224,0.5)";
    ctx.lineWidth = 1;
    ctx.lineCap = "round";
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.l*d.xs, d.y + d.l*d.ys);
      ctx.stroke();
    }
    move();
  }

  function move() {
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      d.x += d.xs;
      d.y += d.ys;
      if (d.x > canvas.width || d.y > canvas.height) {
        d.x = Math.random() * canvas.width;
        d.y = -20;
      }
    }
  }

  function animateRain() {
    draw();
    requestAnimationFrame(animateRain);
  }

  animateRain();
</script>

<!-- Javascripts -->
<script src="js/jquery-3.5.0.min.js"></script>
<script src="js/plugins.js"></script>
<script src="js/main.js"></script>

</body>
</html>
