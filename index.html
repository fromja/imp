<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lofi Haven</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Reset & base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2f;
      color: #fff;
      overflow-x: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(0, 0, 0, 0.3);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
    }
    .logo {
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: float 3s ease-in-out infinite;
    }
    .logo i {
      color: #4dabf7;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .lang-switch {
      cursor: pointer;
      font-size: 0.9rem;
    }
    main {
      padding: 6rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }
    .gallery img {
      width: 100%;
      border-radius: 12px;
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    .about, .community {
      background: rgba(255,255,255,0.05);
      padding: 1rem;
      border-radius: 12px;
    }
    footer {
      text-align: center;
      padding: 2rem;
      opacity: 0.6;
      font-size: 0.9rem;
    }

    /* Weather animations */
    .stars, .rain, .clouds {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    .stars::after {
      content: '';
      background: url('https://raw.githubusercontent.com/marcbruederlin/particles.js/master/demo/img/stars.png') repeat;
      width: 100%; height: 100%;
      display: block;
      animation: starMove 60s linear infinite;
    }
    @keyframes starMove {
      from { background-position: 0 0; }
      to { background-position: 1000px 1000px; }
    }
    .rain::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('https://i.ibb.co/3rDh5cY/rain.gif');
      background-size: cover;
      opacity: 0.5;
    }
    .clouds::after {
      content: '';
      background: url('https://i.ibb.co/PGv8ZzG/clouds.png') repeat-x;
      width: 100%; height: 100%;
      display: block;
      animation: cloudMove 120s linear infinite;
    }
    @keyframes cloudMove {
      from { background-position: 0 0; }
      to { background-position: 1000px 0; }
    }

    /* Chat */
    .chatbox-toggle {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: #4dabf7;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      z-index: 999;
    }
    .chatbox {
      position: fixed;
      bottom: 4rem;
      right: 1rem;
      width: 300px;
      height: 400px;
      background: #2b2b3c;
      border-radius: 12px;
      display: none;
      flex-direction: column;
      z-index: 998;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .chat-input {
      display: flex;
      border-top: 1px solid #444;
    }
    .chat-input input {
      flex: 1;
      padding: 0.5rem;
      border: none;
      background: #1e1e2f;
      color: white;
    }
    .chat-input button {
      background: #4dabf7;
      border: none;
      color: white;
      padding: 0 1rem;
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="rain"></div>
  <div class="clouds"></div>

  <header>
    <div class="logo"><i class="fas fa-circle-check"></i> Lofi Haven Official</div>
    <div class="lang-switch" onclick="toggleLang()">🌐 KA | EN</div>
  </header>

  <main>
    <div class="about" data-en="Welcome to Lofi Haven! A peaceful place for music, chill and connection."
         data-ka="მოგესალმებით LoFi Haven-ში! მშვიდი სივრცე მუსიკისთვის, გართობისთვის და კავშირისათვის.">
      Welcome to Lofi Haven! A peaceful place for music, chill and connection.
    </div>
    <div class="gallery">
      <img src="https://loficafe.imgix.net/wallpapers/w1.webp" alt="LoFi 1">
      <img src="https://loficafe.imgix.net/wallpapers/w2.webp" alt="LoFi 2">
      <img src="https://loficafe.imgix.net/wallpapers/w3.webp" alt="LoFi 3">
    </div>
    <div class="community" data-en="Join our lo-fi community and express yourself." data-ka="შემოგვიერთდი ლო-ფაი საზოგადოებაში და გამოავლინე თავი.">
      Join our lo-fi community and express yourself.
    </div>
  </main>

  <footer>
    Official Lo-Fi Haven &copy; 2025
  </footer>

  <audio autoplay loop>
    <source src="https://www.youtube.com/watch?v=sF80I-TQiW0" type="audio/mpeg">
  </audio>

  <button class="chatbox-toggle" onclick="toggleChat()">💬 Chat</button>
  <div class="chatbox" id="chatbox">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="Type your message...">
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    let currentLang = 'en';
    function toggleLang() {
      currentLang = currentLang === 'en' ? 'ka' : 'en';
      document.querySelectorAll('[data-en]').forEach(el => {
        el.innerText = el.dataset[currentLang];
      });
    }

    let chatVisible = false;
    function toggleChat() {
      const chat = document.getElementById('chatbox');
      chatVisible = !chatVisible;
      chat.style.display = chatVisible ? 'flex' : 'none';
    }

    let username = prompt("Enter your display name:") || 'Guest';
    function sendMessage() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (msg) {
        const msgBox = document.createElement('div');
        msgBox.innerHTML = `<strong>${username}:</strong> ${msg}`;
        document.getElementById('chatMessages').appendChild(msgBox);
        input.value = '';
        msgBox.scrollIntoView();
      }
    }
  </script>
</body>
</html>
