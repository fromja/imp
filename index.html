<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lo-Fi Haven</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #1e1e1e;
      color: #f5f5f5;
      overflow-x: hidden;
      transition: background-color 0.5s, color 0.5s;
    }

    .container {
      text-align: center;
      padding: 50px 20px;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      max-width: 600px;
      margin: 20px auto;
      line-height: 1.6;
    }

    .lofi-girl {
      width: 300px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    select {
      padding: 10px;
      border-radius: 8px;
      margin: 10px;
      font-size: 16px;
      border: none;
    }

    .stars, .clouds {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .cloud {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: 0.3;
      animation: float 60s linear infinite;
    }

    @keyframes float {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100vw); }
    }

    footer {
      margin-top: 100px;
      font-size: 1em;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="clouds" id="clouds"></div>

  <div class="container">
    <img class="lofi-girl" src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExaHM0OHR4NjZ2cHg0NmlucGhoZW1lNm45MDl0djVhcmNtejdta2cyMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/6S0J4T4dy2PIr8htHa/giphy.gif" alt="Lofi Girl" />

    <h1 id="welcome-text">Welcome to Lo-Fi Haven</h1>
    <p id="welcome-paragraph">
      Relax, unwind, and let the soothing sounds of lo-fi beats carry you away.
      Welcome to your peaceful retreat where it's always cozy and calm — whether
      you're studying, working, or just taking a moment for yourself.
    </p>

    <label for="theme-selector">Choose Theme:</label>
    <select id="theme-selector" onchange="changeTheme(this.value)">
      <option value="rain">Rainy Day</option>
      <option value="sunny">Sunny Day</option>
      <option value="night">Night Sky</option>
    </select>

    <footer>Official Lo-Fi Haven</footer>
  </div>

  <script>
    function changeTheme(theme) {
      document.body.className = '';
      document.getElementById('stars').innerHTML = '';
      document.getElementById('clouds').innerHTML = '';

      if (theme === 'rain') {
        document.body.style.backgroundColor = '#1e1e1e';
        // Add rain logic (previous code, simplified here)
      } else if (theme === 'sunny') {
        document.body.style.backgroundColor = '#f0f8ff';
        for (let i = 0; i < 8; i++) {
          const cloud = document.createElement('div');
          cloud.className = 'cloud';
          cloud.style.width = Math.random() * 100 + 100 + 'px';
          cloud.style.height = Math.random() * 60 + 60 + 'px';
          cloud.style.top = Math.random() * 50 + '%';
          cloud.style.left = Math.random() * 100 + '%';
          document.getElementById('clouds').appendChild(cloud);
        }
      } else if (theme === 'night') {
        document.body.style.backgroundColor = '#0b0c1a';
        for (let i = 0; i < 100; i++) {
          const star = document.createElement('div');
          star.className = 'star';
          star.style.left = Math.random() * 100 + 'vw';
          star.style.top = Math.random() * 100 + 'vh';
          document.getElementById('stars').appendChild(star);
        }
      }
    }

    // Load animation - optional fade effect or future Lottie integration
    window.addEventListener('load', () => {
      document.body.style.opacity = 0;
      setTimeout(() => {
        document.body.style.transition = 'opacity 1.5s ease';
        document.body.style.opacity = 1;
      }, 100);
    });
  </script>
</body>
</html>
