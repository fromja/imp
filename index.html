<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Haven</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
        }

        .theme-rainy {
            background: linear-gradient(to bottom, #2e2e2e, #1e1e1e);
            color: #e0e0e0;
        }
        .theme-sunny {
            background: linear-gradient(to top, #fffbd5, #b20a2c);
            color: #1e1e1e;
        }
        .theme-night {
            background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
            color: #e0e0e0;
        }

        .container {
            text-align: center;
            padding: 50px 20px;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            max-width: 700px;
            margin: 20px auto;
            line-height: 1.8;
        }

        button {
            background-color: #ff4081;
            border: none;
            color: white;
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #e73370;
        }

        .social-links a {
            color: #ff4081;
            margin: 0 10px;
            text-decoration: none;
            font-size: 24px;
        }

        .lofi-girl {
            width: 300px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .rain, .clouds, .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            animation: fall linear infinite;
            opacity: 0.5;
        }

        @keyframes fall {
            0% { top: -60px; }
            100% { top: 110vh; }
        }

        .cloud {
            position: absolute;
            width: 200px;
            height: 60px;
            background: #fff;
            border-radius: 100px;
            top: 50px;
            animation: cloudMove 60s linear infinite;
            opacity: 0.3;
        }

        @keyframes cloudMove {
            from { left: -250px; }
            to { left: 110%; }
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }

        .official-badge {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 1.1em;
            color: #ff4081;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            padding: 6px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: fadeIn 2s ease-in-out;
        }

        .official-badge::after {
            content: '\2714';
            background: #3aa3e3;
            color: white;
            font-size: 0.9em;
            border-radius: 50%;
            padding: 2px 6px;
            margin-left: 5px;
        }

        .chatbox {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            max-height: 400px;
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: white;
            font-size: 14px;
        }

        .chat-header {
            background: #ff4081;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-input {
            display: flex;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
        }

        .chat-input button {
            background: #ff4081;
            border: none;
            padding: 10px;
            color: white;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9em;
            color: #aaa;
        }

        .register-form {
            margin: 20px 0;
        }

        .register-form input {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
            width: 250px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .register-form button {
            padding: 10px 20px;
            background-color: #ff4081;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
        }

    </style>
</head>
<body class="theme-night">
    <div class="official-badge">Lofi Haven Official</div>
    <div class="rain" id="rain"></div>
    <div class="clouds" id="clouds"></div>
    <div class="stars" id="stars"></div>

    <audio id="background-music" autoplay loop>
        <source src="https://cdn.pixabay.com/audio/2022/07/26/audio_7771e7b2d5.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <div class="container">
        <img class="lofi-girl" src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExaHM0OHR4NjZ2cHg0NmlucGhoZW1lNm45MDl0djVhcmNtejdta2cyMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/6S0J4T4dy2PIr8htHa/giphy.gif" alt="Lofi Girl">

        <h1 id="welcome-text">Welcome to Lo-Fi Haven</h1>
        <p id="welcome-paragraph">
            Dive into a world of calm. Whether you're studying, working, or just relaxing — Lo-Fi Haven is here to bring peace through mellow beats, cozy visuals, and a soothing atmosphere that feels like home.
        </p>

        <button onclick="setTheme('rainy')">🌧️ Rainy Day</button>
        <button onclick="setTheme('sunny')">☀️ Sunny Day</button>
        <button onclick="setTheme('night')">🌙 Night Sky</button>

        <button onclick="toggleChat()">Open Chat</button>
        <div id="chatbox" class="chatbox collapsed">
            <div class="chat-header" onclick="toggleChat()">Chat</div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="chat-input" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <div class="register-form">
            <input type="text" id="username" placeholder="Enter your username">
            <button onclick="registerUser()">Register</button>
        </div>

    </div>

    <footer>
        <p>Created with ❤️ by Lo-Fi Haven Team</p>
    </footer>

    <script>
        let currentUsername = '';

        function setTheme(theme) {
            const body = document.body;
            body.classList.remove('theme-rainy', 'theme-sunny', 'theme-night');
            if (theme === 'rainy') body.classList.add('theme-rainy');
            else if (theme === 'sunny') body.classList.add('theme-sunny');
            else if (theme === 'night') body.classList.add('theme-night');
        }

        function toggleChat() {
            const chat = document.getElementById('chatbox');
            chat.classList.toggle('collapsed');
            if (chat.classList.contains('collapsed')) {
                chat.style.height = '30px';
            } else {
                chat.style.height = '400px';
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const messages = document.getElementById('chat-messages');
            if (input.value.trim() !== '') {
                const msg = document.createElement('div');
                msg.textContent = (currentUsername ? currentUsername + ': ' : '🗣️ ') + input.value;
                messages.appendChild(msg);
                input.value = '';
                messages.scrollTop = messages.scrollHeight;
            }
        }

        function registerUser() {
            const username = document.getElementById('username').value;
            if (username.trim() !== '') {
                currentUsername = username.trim();
                alert('Welcome, ' + currentUsername + '!');
            } else {
                alert('Please enter a valid username.');
            }
        }
    </script>
</body>
</html>
