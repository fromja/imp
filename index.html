<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Haven</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            padding: 30px;
        }

        #avatarCanvas {
            border: 2px solid #fff;
            border-radius: 20px;
            background-color: #333;
            margin-bottom: 20px;
        }

        .avatar-option {
            display: inline-block;
            cursor: pointer;
            margin: 10px;
        }

        .avatar-option img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #fff;
            transition: transform 0.3s ease;
        }

        .avatar-option img:hover {
            transform: scale(1.1);
        }

        .avatar-options {
            margin: 20px 0;
        }

        button {
            background-color: #ff4081;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #e73370;
        }

        .content {
            margin-top: 30px;
        }

        h1 {
            font-size: 3em;
            color: #ff4081;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .gallery img {
            width: 100%;
            border-radius: 10px;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>
    <h1>Welcome to Lo-Fi Haven</h1>

    <!-- Avatar Creation Section -->
    <h2>Create Your Lo-Fi Avatar</h2>
    <canvas id="avatarCanvas" width="300" height="300"></canvas>

    <div class="avatar-options">
        <h3>Select Hairstyle</h3>
        <div class="avatar-option" onclick="changeAvatar('hairstyle', 'hairstyle1')">
            <img src="https://cdn.pixabay.com/photo/2016/06/29/12/30/girl-1481422_960_720.png" alt="Hairstyle 1">
        </div>
        <div class="avatar-option" onclick="changeAvatar('hairstyle', 'hairstyle2')">
            <img src="https://cdn.pixabay.com/photo/2017/11/07/10/16/girl-2928922_960_720.jpg" alt="Hairstyle 2">
        </div>
        <div class="avatar-option" onclick="changeAvatar('hairstyle', 'hairstyle3')">
            <img src="https://cdn.pixabay.com/photo/2016/06/22/01/36/woman-1463151_960_720.jpg" alt="Hairstyle 3">
        </div>
    </div>

    <div class="avatar-options">
        <h3>Select Outfit</h3>
        <div class="avatar-option" onclick="changeAvatar('outfit', 'outfit1')">
            <img src="https://cdn.pixabay.com/photo/2017/10/27/21/52/woman-2894390_960_720.jpg" alt="Outfit 1">
        </div>
        <div class="avatar-option" onclick="changeAvatar('outfit', 'outfit2')">
            <img src="https://cdn.pixabay.com/photo/2015/12/16/06/54/woman-1092346_960_720.jpg" alt="Outfit 2">
        </div>
        <div class="avatar-option" onclick="changeAvatar('outfit', 'outfit3')">
            <img src="https://cdn.pixabay.com/photo/2017/07/30/03/15/girl-2553731_960_720.jpg" alt="Outfit 3">
        </div>
    </div>

    <div class="avatar-options">
        <h3>Select Face Style</h3>
        <div class="avatar-option" onclick="changeAvatar('face', 'face1')">
            <img src="https://cdn.pixabay.com/photo/2017/10/10/17/39/woman-2832295_960_720.jpg" alt="Face 1">
        </div>
        <div class="avatar-option" onclick="changeAvatar('face', 'face2')">
            <img src="https://cdn.pixabay.com/photo/2017/10/10/16/39/girl-2832293_960_720.jpg" alt="Face 2">
        </div>
        <div class="avatar-option" onclick="changeAvatar('face', 'face3')">
            <img src="https://cdn.pixabay.com/photo/2017/10/10/15/57/face-2832292_960_720.jpg" alt="Face 3">
        </div>
    </div>

    <button onclick="downloadAvatar()">Download Avatar</button>

    <!-- Image Gallery Section -->
    <div class="content">
        <h2>Lo-Fi Image Gallery</h2>
        <div class="gallery">
            <img src="https://cdn.pixabay.com/photo/2017/02/20/18/09/woman-2084536_960_720.jpg" alt="Lo-Fi Image 1">
            <img src="https://cdn.pixabay.com/photo/2017/10/09/11/16/woman-2830041_960_720.jpg" alt="Lo-Fi Image 2">
            <img src="https://cdn.pixabay.com/photo/2016/09/01/23/14/girl-1631292_960_720.jpg" alt="Lo-Fi Image 3">
        </div>
    </div>

    <script>
        const canvas = document.getElementById("avatarCanvas");
        const ctx = canvas.getContext("2d");

        let avatar = {
            hairstyle: null,
            outfit: null,
            face: null
        };

        // Change avatar parts
        function changeAvatar(type, part) {
            avatar[type] = part;
            updateAvatar();
        }

        // Update the avatar on the canvas
        function updateAvatar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear the canvas before redrawing

            // Draw hairstyle
            if (avatar.hairstyle) {
                let img = new Image();
                img.src = `https://cdn.pixabay.com/photo/2016/06/29/12/30/girl-1481422_960_720.png`;
                img.onload = function() {
                    ctx.drawImage(img, 50, 20, 200, 150); // Adjust positioning and size
                };
            }

            // Draw outfit
            if (avatar.outfit) {
                let img = new Image();
                img.src = `https://cdn.pixabay.com/photo/2017/10/27/21/52/woman-2894390_960_720.jpg`;
                img.onload = function() {
                    ctx.drawImage(img, 50, 150, 200, 150); // Adjust positioning and size
                };
            }

            // Draw face
            if (avatar.face) {
                let img = new Image();
                img.src = `https://cdn.pixabay.com/photo/2017/10/10/17/39/woman-2832295_960_720.jpg`;
                img.onload = function() {
                    ctx.drawImage(img, 50, 100, 200, 150); // Adjust positioning and size
                };
            }
        }

        // Download the avatar as an image
        function downloadAvatar() {
            const link = document.createElement("a");
            link.download = "lofi-avatar.png";
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
