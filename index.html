<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
        }

        #gameArea {
            border: 2px solid #fff;
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(20, 30px);
            gap: 1px;
            background-color: #111;
        }

        .cell {
            width: 30px;
            height: 30px;
            background-color: #222;
        }

        .filled {
            background-color: #3498db;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
        }

        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div id="gameArea"></div>
    <div id="score">Score: 0</div>
    <button onclick="startGame()">Start New Game</button>

    <script>
        const width = 10;
        const height = 20;
        const gameArea = document.getElementById('gameArea');
        const scoreDisplay = document.getElementById('score');
        const cells = [];
        let score = 0;
        let currentPiece, nextPiece, piecePosition;
        let gameInterval, gameOver = false;

        const shapes = [
            [[1, 1, 1, 1]], // I
            [[1, 1], [1, 1]], // O
            [[0, 1, 0], [1, 1, 1]], // T
            [[1, 1, 0], [0, 1, 1]], // S
            [[0, 1, 1], [1, 1, 0]], // Z
            [[1, 0, 0], [1, 1, 1]], // L
            [[0, 0, 1], [1, 1, 1]]  // J
        ];

        function createGrid() {
            for (let i = 0; i < width * height; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                gameArea.appendChild(cell);
                cells.push(cell);
            }
        }

        function drawPiece(piece, offsetX, offsetY) {
            piece.forEach((row, y) => {
                row.forEach((block, x) => {
                    if (block) {
                        const index = (y + offsetY) * width + (x + offsetX);
                        if (index >= 0 && index < cells.length) {
                            cells[index].classList.add('filled');
                        }
                    }
                });
            });
        }

        function clearPiece(piece, offsetX, offsetY) {
            piece.forEach((row, y) => {
                row.forEach((block, x) => {
                    if (block) {
                        const index = (y + offsetY) * width + (x + offsetX);
                        if (index >= 0 && index < cells.length) {
                            cells[index].classList.remove('filled');
                        }
                    }
                });
            });
        }

        function isValidMove(piece, offsetX, offsetY) {
            return piece.every((row, y) => {
                return row.every((block, x) => {
                    if (!block) return true;
                    const index = (y + offsetY) * width + (x + offsetX);
                    if (index < 0 || index >= cells.length) return false;
                    return !cells[index].classList.contains('filled');
                });
            });
        }

        function dropPiece() {
            if (isValidMove(currentPiece, piecePosition.x, piecePosition.y + 1)) {
                piecePosition.y++;
            } else {
                placePiece();
            }
            updateGame();
        }

        function placePiece() {
            drawPiece(currentPiece, piecePosition.x, piecePosition.y);
            clearFullLines();
            generateNewPiece();
        }

        function clearFullLines() {
            for (let row = height - 1; row >= 0; row--) {
                const rowCells = [];
                for (let col = 0; col < width; col++) {
                    rowCells.push(cells[row * width + col]);
                }

                if (rowCells.every(cell => cell.classList.contains('filled'))) {
                    rowCells.forEach(cell => cell.classList.remove('filled'));
                    shiftDown(row);
                    score += 10;
                    scoreDisplay.textContent = `Score: ${score}`;
                }
            }
        }

        function shiftDown(row) {
            for (let y = row - 1; y >= 0; y--) {
                for (let x = 0; x < width; x++) {
                    const fromIndex = y * width + x;
                    const toIndex = (y + 1) * width + x;
                    cells[toIndex].className = cells[fromIndex].className;
                }
            }
        }

        function generateNewPiece() {
            currentPiece = nextPiece || shapes[Math.floor(Math.random() * shapes.length)];
            nextPiece = shapes[Math.floor(Math.random() * shapes.length)];
            piecePosition = { x: Math.floor(width / 2) - 2, y: 0 };

            if (!isValidMove(currentPiece, piecePosition.x, piecePosition.y)) {
                gameOver = true;
                clearInterval(gameInterval);
                alert('Game Over!');
            }
        }

        function updateGame() {
            if (!gameOver) {
                clearPiece(currentPiece, piecePosition.x, piecePosition.y);
                dropPiece();
                drawPiece(currentPiece, piecePosition.x, piecePosition.y);
            }
        }

        function startGame() {
            cells.forEach(cell => cell.classList.remove('filled'));
            score = 0;
            scoreDisplay.textContent = `Score: ${score}`;
            gameOver = false;
            generateNewPiece();
            gameInterval = setInterval(updateGame, 500);
        }

        document.addEventListener('keydown', (e) => {
            if (gameOver) return;

            if (e.key === 'ArrowLeft') {
                if (isValidMove(currentPiece, piecePosition.x - 1, piecePosition.y)) {
                    piecePosition.x--;
                }
            } else if (e.key === 'ArrowRight') {
                if (isValidMove(currentPiece, piecePosition.x + 1, piecePosition.y)) {
                    piecePosition.x++;
                }
            } else if (e.key === 'ArrowDown') {
                if (isValidMove(currentPiece, piecePosition.x, piecePosition.y + 1)) {
                    piecePosition.y++;
                }
            } else if (e.key === 'ArrowUp') {
                const rotated = currentPiece[0].map((_, index) => currentPiece.map(row => row[index])).reverse();
                if (isValidMove(rotated, piecePosition.x, piecePosition.y)) {
                    currentPiece = rotated;
                }
            }
        });

        createGrid();
    </script>

</body>
</html>
